# Pruebas offline (fixtures grabados, sin red) en cada push y pull request.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: |
          pip install -r requirements.txt
          pip install --no-deps -e .
      - run: pytest -q
