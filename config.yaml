# Buscadores de sucursales de cadenas. Verificados 2026-10-20: endpoints públicos (sin login) que robots.txt
# no prohíbe. Las consultas por cercanía se hacen desde el centro de cada partido activo, hasta cubrir su radio.
#   tipo vtex_pickup: API pública de puntos de retiro de tiendas VTEX (/api/checkout/pub/pickup-points).
#   tipo next_data: listado embebido en __NEXT_DATA__ de la página (ruta = claves hasta la lista).
#   tipo wpsl: plugin WP Store Locator (admin-ajax.php?action=store_search).
#   tipo havanna: endpoint AJAX propio del sitio (_ajax/getLocalesByTipo).
sucursales:
  activa: true
  minimo_relativo: 0.8
  max_paginas_vtex: 6
  cadenas:
    - {id: fravega, nombre: Frávega, rubro: Electro y tecnología, tipo: next_data, url: "https://www.fravega.com/sucursales",
       ruta: [props, pageProps, branches],
       campos: {id: id, nombre: name, lat: address.coordinates.latitude, lon: address.coordinates.longitude, direccion: address.street, localidad: address.location}}
    - {id: dia, nombre: Supermercados Día, rubro: Alimentos y supermercados, tipo: vtex_pickup, host: diaonline.supermercadosdia.com.ar}
