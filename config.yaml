# Configuración del Radar de aperturas comerciales — Zona Norte GBA.
# Todo lo ajustable vive acá; el código no tiene valores fijos de zona, rubros ni pesos.

proyecto:
  nombre: radar-locales
  repo_url: https://github.com/artebleker/radar-locales
  user_agent: "radar-locales/0.1 (+https://github.com/artebleker/radar-locales)"
  zona_horaria: America/Argentina/Buenos_Aires

http:
  timeout_s: 60
  timeout_dns_s: 15          # requests no limita la resolución DNS; se acota aparte
  pausa_por_host_s: 3        # pausa mínima entre pedidos a un mismo host
  espera_reintento_s: 30     # ante 429/406/5xx (política de Overpass: >= 30 s)
  reintentos: 2
  cache_ttl_h: 20            # una corrida diaria: la caché evita repetir pedidos el mismo día
  # Hosts cuyo robots.txt bloquea a crawlers pero que publican una API con política de uso
  # explícita para clientes programáticos. Se usan respetando esa política, no como crawler.
  robots_excepciones:
    overpass-api.de: "API pública con política de uso documentada (wiki.openstreetmap.org/wiki/Overpass_API#Public_Overpass_API_instances); robots.txt apunta a indexadores."

overpass:
  # Se prueban en orden; ante falla se espera http.espera_reintento_s y se pasa al siguiente.
  # Revisado 2026-10-20 en la wiki y con pedidos reales:
  # overpass-api.de: uso regular < 100 consultas y < 10 MB por día; respondió (lento, ~27 s).
  # private.coffee: «Feel free to use our service in any project, there is no rate limit in place»;
  #   desde la máquina de desarrollo el DNS del sistema se colgó, queda como respaldo.
  # maps.mail.ru: devolvió 504 en la prueba; último respaldo.
  endpoints:
    - https://overpass-api.de/api/interpreter
    - https://overpass.private.coffee/api/interpreter
    - https://maps.mail.ru/osm/tools/overpass/api/interpreter
  timeout_query_s: 180

geo:
  provincia_iso: AR-B
  # Verificado con Overpass el 2026-10-20: los partidos bonaerenses son admin_level=5
  # y se llaman «Partido de X» (Pilar: «Partido del Pilar»). Los niveles 8/9 son ciudades y barrios.
  admin_level_partido: 5
  tipos_place: [city, town, suburb, neighbourhood, village]
  simplificar_grados: 0.0001   # ~10 m; achica los límites guardados en el repo

# relacion = ID de relación OSM, verificado contra el tag name (osm_nombre) en cada bootstrap.
partidos:
  - {nombre: Vicente López,        osm_nombre: Partido de Vicente López,        relacion: 2752665, activo: true}
  - {nombre: San Isidro,           osm_nombre: Partido de San Isidro,           relacion: 1769044, activo: true}
  - {nombre: San Fernando,         osm_nombre: Partido de San Fernando,         relacion: 2443418, activo: true}
  - {nombre: Tigre,                osm_nombre: Partido de Tigre,                relacion: 2411762, activo: true}
  - {nombre: San Martín,           osm_nombre: Partido de General San Martín,   relacion: 1719022, activo: true}
  - {nombre: Escobar,              osm_nombre: Partido de Escobar,              relacion: 2443300, activo: true}
  - {nombre: Pilar,                osm_nombre: Partido del Pilar,               relacion: 2431954, activo: true}
  - {nombre: Malvinas Argentinas,  osm_nombre: Partido de Malvinas Argentinas,  relacion: 2430452, activo: true}
  # Opcionales: verificados, apagados. Para sumarlos, poner activo: true.
  - {nombre: San Miguel,           osm_nombre: Partido de San Miguel,           relacion: 2430369, activo: false}
  - {nombre: José C. Paz,          osm_nombre: Partido de José C. Paz,          relacion: 2430431, activo: false}
  - {nombre: Tres de Febrero,      osm_nombre: Partido de Tres de Febrero,      relacion: 1767378, activo: false}
  - {nombre: Campana,              osm_nombre: Partido de Campana,              relacion: 2451540, activo: false}

rutas:
  ref: data/ref
  snapshots: data/snapshots
  historial: data/historial
  cache: data/cache
  site_data: site/data
  fixtures: tests/fixtures

# Rubros: etiquetas OSM → rubro. Lo no mapeado (cualquier otro shop=*) va a «Otros».
# palabras: para noticias y directorios (se buscan en título o categoría, normalizadas sin tildes).
rubros:
  Gastronomía:
    osm: {amenity: [restaurant, cafe, fast_food, bar, pub, ice_cream], shop: [bakery, pastry, confectionery, coffee]}
    palabras: [restaurante, restaurant, resto, cafe, cafeteria, bar, cerveceria, heladeria, helado, pizzeria, parrilla, hamburgueseria, hamburguesa, panaderia, pasteleria, sushi, bodegon, brunch, gastronomic, gastronomia, comida, rotiseria, pasta]
  Indumentaria y calzado:
    osm: {shop: [clothes, shoes, boutique, fashion_accessories, jewelry, bag, sports]}
    palabras: [indumentaria, ropa, moda, zapatilla, zapatillas, calzado, zapateria, joyeria, deportes, deportiva, outlet, boutique, marroquineria, lenceria, jean]
  Electro y tecnología:
    osm: {shop: [electronics, appliance, computer, mobile_phone, hifi, video_games]}
    palabras: [electro, electrodomesticos, tecnologia, celulares, celular, computacion, gaming, electronica]
  Alimentos y supermercados:
    osm: {shop: [supermarket, convenience, greengrocer, butcher, deli, wholesale, beverages, alcohol]}
    palabras: [supermercado, super, mayorista, almacen, autoservicio, market, minimarket, verduleria, carniceria, fiambreria, dietetica, vinoteca, minimercado, hipermercado]
  Belleza y salud:
    osm: {shop: [hairdresser, beauty, cosmetics, chemist, optician, perfumery], amenity: [pharmacy]}
    palabras: [farmacia, peluqueria, barberia, estetica, belleza, cosmetica, perfumeria, optica, spa, manicuria]
  Hogar y construcción:
    osm: {shop: [hardware, doityourself, furniture, houseware, paint, interior_decoration, garden_centre]}
    palabras: [ferreteria, corralon, muebles, muebleria, deco, decoracion, pintureria, hogar, bazar, vivero, sanitarios, construccion]
  Otros:
    osm: {leisure: [fitness_centre], amenity: [veterinary]}
    palabras: [gimnasio, gym, veterinaria, libreria, jugueteria, kiosco, lavadero, petshop, mascotas]

osm:
  activa: true
  ventana_creacion_dias: 30          # creacion_osm: version 1 con timestamp dentro de la ventana
  detectar_desaparicion: false       # señal opcional de posible cierre
  # Prefijos de ciclo de vida (wiki Lifecycle_prefix, revisada 2026-10-20) que indican «por abrir».
  prefijos_por_abrir: [construction, planned, proposed]
  # shop=* con estos valores no son comercios abiertos; se guardan en el snapshot para detectar
  # que un local vacío pasó a tener rubro, pero no generan altas.
  shop_no_comercio: [vacant, "no"]
  ttl_cache_h: 20

# Feeds de medios locales. Verificados con pedidos reales el 2026-10-20.
# tipo: rss (RSS/Atom; paginable = WordPress acepta ?paged=N) | wp_json (API pública /wp-json/wp/v2/posts
#   de WordPress, para sitios con el feed desactivado). partido_defecto: si la nota no nombra lugar,
#   se asume el partido del medio (con penalización).
medios_rss:
  activa: true
  ventana_dias: 30
  paginas_max: 5
  feeds:
    - {nombre: Zona Norte Diario,      tipo: rss,     url: "https://www.zonanortediario.com.ar/feed/", paginable: true}
    - {nombre: Qué Pasa Web,           tipo: rss,     url: "https://www.quepasaweb.com.ar/feed/", paginable: true}
    - {nombre: Diario Resumen,         tipo: rss,     url: "https://www.resumendelaregion.com/feed/", paginable: true, partido_defecto: Pilar}
    - {nombre: Escobar a Diario,       tipo: rss,     url: "https://escobaradiario.com.ar/feed/", paginable: true, partido_defecto: Escobar}
    - {nombre: La Troncal,             tipo: rss,     url: "https://latroncal.com.ar/feed/", paginable: true}
    - {nombre: Periódico Para Todos,   tipo: rss,     url: "https://periodicoparatodos.com.ar/feed/", paginable: true}
    - {nombre: Zonales,                tipo: rss,     url: "https://zonales.com/feed/", paginable: true}
    - {nombre: Pilar a Diario,         tipo: rss,     url: "https://www.pilaradiario.com/rss/pages/ultimas-noticias.xml", partido_defecto: Pilar}
    - {nombre: Pilar a Diario,         tipo: rss,     url: "https://www.pilaradiario.com/rss/pages/economia.xml", partido_defecto: Pilar}
    - {nombre: Pilar a Diario,         tipo: rss,     url: "https://www.pilaradiario.com/rss/pages/locales.xml", partido_defecto: Pilar}
    - {nombre: Pilar de Todos,         tipo: rss,     url: "https://pilardetodosapiv3.eleco.com.ar/feed-notes", partido_defecto: Pilar}
    - {nombre: El Día de Escobar,      tipo: wp_json, url: "https://eldiadeescobar.com.ar/wp-json/wp/v2/posts", partido_defecto: Escobar}
    - {nombre: Zona Norte Visión,      tipo: wp_json, url: "https://zonanortevision.com.ar/wp-json/wp/v2/posts"}
  # Probados y descartados (2026-10-20):
  #   eldiadeescobar.com.ar/feed/ y zonanortevision.com.ar/feed/: devuelven HTML (feed desactivado) → se usa wp_json.
  #   pilaradiario.com/feed/: 404 → se usan sus feeds por sección.
  #   tigrealdia.com.ar: redirige a un sitio de apuestas.  zonanortehoy.com: sin feed.  infoescobar.com.ar: error SSL.
  #   zonalnorte.com.ar, eldiariodepilar.com.ar, sanisidroaldia.com.ar, primeraseccion.com.ar, diariosietedias.com.ar,
  #   elvecinaldesanisidro.com.ar, prensalibre-online.com.ar, laopiniondetigre.com.ar: el dominio no resuelve.
  #   Búsquedas de WordPress (/?s=...&feed=rss2): descartadas, robots.txt de varios medios prohíbe /?s=.
  #   news.google.com/rss: robots.txt prohíbe /rss; excluido por decisión del proyecto.

# Extracción por reglas para notas (sin IA). Todo se compara normalizado (minúsculas, sin tildes).
extraccion:
  # Verbos/frases de apertura. Pasado → «abrió»; futuro o presente → «por abrir» salvo fecha pasada.
  verbos_pasado: [abrio, abrieron, inauguro, inauguraron, desembarco, desembarcaron, reabrio, llego, llegaron, estreno, "abrio sus puertas", "ya funciona", "ya esta abierto", "ya esta abierta"]
  verbos_futuro: [abre, abren, abrira, abriran, inaugura, inauguran, inaugurara, inauguraran, "se inaugura", desembarca, desembarcara, llega, llegan, llegara, reabre, reabrira, "proxima apertura", "abrira sus puertas", "nuevo local", "nueva sucursal", "nueva tienda", "nuevo restaurante", "nueva cafeteria", "nuevo bar", apertura, "futura sucursal", "futuro local", "futura tienda", "nueva sede", "nuevo punto de venta", proximamente, "se instala", "se instalara"]
  # Contexto comercial (además de las palabras de rubros). Sin esto la nota se conserva solo si hay
  # nombre y lugar, y con penalización.
  contexto_comercial: [local, locales, tienda, tiendas, sucursal, sucursales, comercio, comercios, negocio, franquicia, cadena, marca, showroom, outlet, shopping, "centro comercial", "paseo comercial", "open mall", emprendimiento, supermercado]
  # Exclusiones fuertes: la nota se descarta (no es un local comercial).
  exclusiones: ["unidad basica", "local partidario", "locales partidarios", "centro de monitoreo", escuela, escuelas, colegio, jardin de infantes, universidad, "edificio educativo", "edificios educativos", plaza, parque, "espacio publico", "espacio verde", hospital, "centro de salud", caps, upa, comisaria, teatro, obra, obras, festival, concierto, recital, fiesta, feria, desfile, muestra, exposicion, congreso, inscripcion, inscripciones, juegos, torneo, competencia, linea, estacion, tren, trenes, colectivo, ciclovia, "paso bajo nivel", corredor, polideportivo, "campo de deportes", oficina, registro, cementerio, comedor, parroquia, capilla, iglesia, museo, pileta, colonia, vacunacion, operativo, anses, pami, temporada, "fin de mes", ciclo, carrera, carreras, cursos, curso, taller, talleres, jazz, musica, espectaculo, espectaculos, show, shows, banda, cultura, cultural, agenda]
  # Exclusiones débiles: no descartan, bajan la confianza.
  exclusiones_debiles: [convocatoria, municipio, municipal, intendente, intendenta, gobierno, provincia, ministro, ministra, concejo, concejal, diputado, diputada, senador, gobernador, presidente]
  # Homónimos de otras provincias o países: la nota habla de otro lugar y se descarta.
  homonimos: ["pilar de cordoba", "pilar cordoba", "pilar en cordoba", "san martin de los andes", "general san martin de mendoza", "san martin mendoza", "san isidro de lules", "san isidro lules", "san fernando del valle", "san fernando de catamarca"]
  # Nombres que contienen un partido pero no ubican la nota: se ignoran al buscar el lugar.
  nombres_neutros: ["club atletico tigre", "club tigre", "pablo escobar", "jose de san martin"]
  palabras_calle: [av, avenida, calle, ruta, colectora, pasaje, pje, esquina, diagonal, boulevard, bv, autopista, acceso, plaza]
  # Lugares fuera de zona escritos de otra forma que en OSM (los partidos y barrios porteños salen de OSM).
  fuera_de_zona_extra: [caba, "capital federal", "ciudad de buenos aires", "la plata", "mar del plata", cordoba, rosario, mendoza, tucuman, salta, neuquen, bariloche, "santa fe", "conurbano sur", "zona sur", "zona oeste", china, uruguay, chile, brasil, "estados unidos", espana]

# Directorios de shoppings. Un adaptador genérico: cada sitio define sus páginas, el patrón de link de
# cada tienda (el grupo 1 es el id) y de dónde sale el nombre. Verificados 2026-10-20 (robots.txt permite).
#   nombre_desde: enlace (texto o alt del link) | selector (CSS dentro de la tarjeta) | slug | img_alt (sin links)
#   {n} en la url = paginación desde 0 hasta que una página no traiga tiendas nuevas.
#   lat/lon: del shopping en OSM (el partido se calcula por punto-en-polígono).
directorios:
  activa: true
  max_paginas: 40
  minimo_relativo: 0.8       # si hoy hay menos del 80 % de las tiendas del snapshot, se asume falla
  patron_por_abrir: "proximamente|próximamente|nueva apertura|pronto abrimos|coming soon"
  sitios:
    - &cencosud
      id: unicenter
      nombre: Unicenter
      osm: way/122963275
      lat: -34.5079
      lon: -58.52533
      paginas: [{url: "https://shoppingscencosud.com.ar/unicenter/locales?page={n}"}]
      enlace: "/unicenter/tiendas/([a-z0-9-]+)$"
      nombre_desde: selector
      selector: ".views-field-title"
    - {<<: *cencosud, id: palmasdelpilar, nombre: Palmas del Pilar, osm: way/255756959, lat: -34.44696, lon: -58.86814,
       paginas: [{url: "https://shoppingscencosud.com.ar/palmasdelpilar/locales?page={n}"}], enlace: "/palmasdelpilar/tiendas/([a-z0-9-]+)$"}
    - {<<: *cencosud, id: portalescobar, nombre: Portal Escobar, osm: relation/4293806, lat: -34.36179, lon: -58.7957,
       paginas: [{url: "https://shoppingscencosud.com.ar/escobar/locales?page={n}"}], enlace: "/escobar/tiendas/([a-z0-9-]+)$"}
    - {<<: *cencosud, id: factorysanmartin, nombre: Factory San Martín, osm: way/30450376, lat: -34.56253, lon: -58.55696,
       paginas: [{url: "https://shoppingscencosud.com.ar/sanmartin/locales?page={n}"}], enlace: "/sanmartin/tiendas/([a-z0-9-]+)$"}
    - id: champagnat
      nombre: Paseo Champagnat
      osm: way/385309914
      lat: -34.44975
      lon: -58.91655
      paginas:
        - {url: "https://www.paseochampagnat.com.ar/locales-paseo-champagnat/planta-baja/"}
        - {url: "https://www.paseochampagnat.com.ar/locales-paseo-champagnat/primer-piso/"}
      nombre_desde: img_alt
      excluir_alt: ["Paseo Champagnat"]
    - id: remeros
