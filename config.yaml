  # Probadas y descartadas (2026-10-20):
  #   McDonald's: 403 al pedir /restaurantes (bloqueo; no se evade).  Farmacity: robots.txt prohíbe /api/checkout/*.
  #   Megatone, Cetrogar: robots.txt prohíbe el endpoint.  Pigmento, Naldo: los puntos de retiro son lockers de terceros.
  #   Vea, Jumbo, Disco: el endpoint devuelve 0 puntos.  Coto: no devuelve JSON.  Changomás: no conecta.
  #   Café Martínez, Grido, Mostaza, KFC, Burger King, Starbucks, Lucciano's, Rapanui: listado cargado por JS
  #   sin endpoint público identificable en el HTML.  Dexter, Grimoldi: sin API VTEX.  Freddo: no responde.

# ARCA (ver docs/ARCA.md): los web services no son viables; el CUIT se asocia con el padrón (sección padron) y el sitio enlaza la consulta oficial manual.
arca:
  estado: verificacion_manual_enlazada
  comprobado_el: "2026-10-20"
  url_constancia: "https://seti.afip.gob.ar/padron-puc-constancia-internet/ConsultaConstanciaAction.do"
  nota: "Si conocés el CUIT del comercio, podés verificar su inscripción en ARCA. Una inscripción no prueba que el local esté abierto."

# Puntaje de confianza (0-100). Reglas en radar/scoring.py; acá solo los números.
puntaje:
  base:                       # peso de la mejor señal del candidato
    alta_sucursal: 65
    alta_directorio: 65
    nota_prensa: 50
    por_abrir_osm: 35
    cambio_osm: 30
    creacion_osm: 25
    alta_osm: 25
    corroboracion_arca: 0     # nunca prueba autónoma de apertura
    baja_osm: 0
  bonos:
    fuente_adicional: 20      # por cada fuente distinta además de la primera
    fecha_exacta: 10
    direccion: 5
  penalizaciones:
    sin_nombre: -15
    partido_dudoso: -15
    partido_del_medio: -10
    lugar_solo_en_resumen: -5
    exclusion_debil: -15
    sin_contexto_comercial: -15
    menciona_anio_viejo: -20
  umbrales: {alta: 60, media: 35}

deduplicacion:
  umbral_nombre: 88           # rapidfuzz token_set_ratio sobre nombres normalizados
  distancia_m: 150
  # Se quitan al comparar nombres (en cualquier posición): «Supermercados Día» ≈ «Día».
  palabras_genericas: [srl, "s r l", sa, "s a", sas, "s a s", sau, "s a u", "sociedad anonima", "sociedad de responsabilidad limitada", sucursal, local, tienda, supermercados, supermercado]

publicacion:
  ventanas_dias: [7, 14, 30, 90]
  ventana_defecto: 30
  historial_dias: 180

# Padrón público de ARCA (archivo de condición tributaria). Verificado 2026-10-21 con una descarga real:
# zip de 86 MB con un .txt de ancho fijo (51 caracteres por línea, 6,2 millones de filas, latin-1).
# Diseño oficial: https://www.arca.gob.ar/genericos/cInscripcion/archivoCompleto.asp
# El archivo NO trae domicilio, código postal, fecha de inicio ni actividad detallada: esas columnas quedan en null
# y el cruce por dirección se activa solo si algún día un archivo las trae. Hoy el cruce es por nombre.
# Privacidad: al leer se descartan las personas físicas; en disco solo queda un derivado con personas jurídicas.
padron:
  activa: true
  url: "https://www.afip.gob.ar/genericos/cInscripcion/archivos/apellidoNombreDenominacion.zip"
  formato: zip_txt            # zip_txt | txt (ancho fijo) | csv | zip_csv (columnas por nombre de encabezado)
  codificacion: latin-1
  largo_linea: 51
  columnas:                   # ancho fijo: [inicio, fin) desde 0. null = el archivo no trae ese dato
    cuit: [0, 11]
    razon_social: [11, 41]
    ganancias: [41, 43]
    iva: [43, 45]
    monotributo: [45, 47]
    integrante_sociedad: [47, 48]
    empleador: [48, 49]
    actividad_monotributo: [49, 51]
    domicilio_calle: null
    domicilio_altura: null
    codigo_postal: null
    localidad: null
    fecha_inicio_actividades: null
    actividad_principal: null
  prefijos_juridica: ["30", "33", "34"]
  prefijos_fisica: ["20", "23", "24", "27"]
  frecuencia_dias: 30
  umbral_nombre: 88           # token_set_ratio: primer filtro de nombres similares
  umbral_orden: 95            # token_sort_ratio: segundo filtro, si el candidato no está contenido en la razón social
  min_largo_nombre: 5         # nombres más cortos («Leo», «Baba») coinciden con sociedades de todo el país
  min_largo_una_palabra: 7    # nombres de una sola palabra («Junior», «Grido») son demasiado genéricos
  timeout_s: 600
