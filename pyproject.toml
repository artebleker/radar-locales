[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-locales"
version = "0.1.0"
description = "Radar de aperturas comerciales en Zona Norte del GBA"
license = "MIT"
requires-python = ">=3.11"

[project.scripts]
radar = "radar.cli:main"

[tool.setuptools.packages.find]
include = ["radar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
